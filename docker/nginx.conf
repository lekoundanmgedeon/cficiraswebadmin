# Configuration nginx du frontend CFI/CIRAS.
#
# Remplace la configuration principale de l'image, et non un fragment de
# `conf.d/` : il faut pouvoir déplacer le fichier PID et les répertoires
# temporaires hors de `/var/run` et `/var/cache`, que l'utilisateur `nginx` ne
# peut pas écrire.

worker_processes auto;

# Sous `USER nginx`, écrire dans /var/run est refusé et nginx sort aussitôt
# avec « Permission denied » — une panne qui ressemble à une erreur de
# configuration alors qu'il ne s'agit que de droits.
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Mêmes raisons que pour le PID : tous les tampons vont dans /tmp.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # Journaux sur la sortie standard : c'est `docker logs` qui les collecte, pas
  # un fichier qui grossirait dans le conteneur sans rotation.
  access_log /dev/stdout;

  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/wasm;

  # Résolution du nom `api` : Docker fournit son DNS interne en 127.0.0.11.
  # Sans `resolver`, nginx résout le nom **une seule fois au démarrage** et
  # garde l'adresse : si le conteneur de l'API redémarre et change d'IP, le
  # front sert des 502 jusqu'à ce qu'on le redémarre lui aussi.
  resolver 127.0.0.11 valid=30s ipv6=off;

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Le backend limite déjà à 10 Mo (`express.json`) ; on refuse plus tôt,
    # avant de mobiliser Node pour un corps qu'il rejettera.
    client_max_body_size 12m;

    # ─── API ─────────────────────────────────────────────────────────────────
    #
    # Le bundle appelle `/api/...` en relatif (voir l'en-tête du Dockerfile).
    # `$amont` en variable, et non en dur dans `proxy_pass` : c'est ce qui force
    # nginx à repasser par le resolver plutôt qu'à figer l'adresse au démarrage.
    location /api/ {
      set $amont http://api:3000;
      proxy_pass $amont;

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # L'assistant IA interroge un modèle distant : une réponse peut demander
      # plusieurs dizaines de secondes (`ASSISTANT_TIMEOUT_MS` vaut 60 s côté
      # backend). Le défaut de nginx — 60 s — coupait la requête juste avant que
      # le backend rende sa réponse, et l'utilisateur voyait un 504 sur une
      # question qui avait pourtant abouti.
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;

      # Aucune mise en cache : les réponses sont authentifiées et propres à
      # l'utilisateur.
      proxy_buffering off;
    }

    # Photos de trombinoscope, servies par Express depuis `uploads/`.
    location /uploads/ {
      set $amont_fichiers http://api:3000;
      proxy_pass $amont_fichiers;
      proxy_set_header Host $host;
      expires 1h;
    }

    # Sondes de l'API, utiles aux scripts de vérification qui ne connaissent que
    # l'URL publique du front.
    location = /api-ready {
      set $amont_sonde http://api:3000/ready;
      proxy_pass $amont_sonde;
      access_log off;
    }

    # ─── Fichiers du bundle ──────────────────────────────────────────────────
    #
    # Vite écrit un condensat dans chaque nom de fichier : le contenu de
    # `/assets/index-a1b2c3.js` ne change jamais. Un cache d'un an est donc sûr,
    # et c'est lui qui rend les visites suivantes immédiates.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # ─── Routage SPA ─────────────────────────────────────────────────────────
    #
    # `/etudiants/42` n'existe pas sur le disque : c'est vue-router qui la
    # résout, côté navigateur. Sans ce repli, rafraîchir une page profonde rend
    # un 404 — le défaut le plus courant d'un SPA mal servi.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # `index.html` référence les bundles par leur condensat : le mettre en cache
    # servirait indéfiniment d'anciens noms de fichiers, effacés au déploiement
    # suivant. L'application afficherait alors une page blanche après chaque
    # mise à jour, jusqu'à ce que l'utilisateur vide son cache.
    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      expires 0;
    }

    # ─── En-têtes de sécurité ────────────────────────────────────────────────
    #
    # Le proxy frontal (Caddy) en pose déjà en production ; ceux-ci restent
    # valables quand le conteneur est joint directement, en dev-docker.
    add_header X-Content-Type-Options    "nosniff"                        always;
    add_header X-Frame-Options           "DENY"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
  }
}
